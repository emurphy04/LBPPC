# The shape of /etc/lbppc/accounts/kratos/secrets.yml (root:ory-kratos, 640). Made by install.sh with random values;
# never commit the real file.
dsn: postgres://kratos:DB_PASSWORD@127.0.0.1:5432/kratos?sslmode=disable&max_conns=10

secrets:
  default: [RANDOM_64_HEX]
  cookie: [RANDOM_64_HEX]
  cipher: [RANDOM_32_CHARS]   # exactly 32 characters (XChaCha20-Poly1305)

selfservice:
  methods:
    password:
      config:
        migrate_hook:
          config:
            auth:
              type: api_key
              config:
                name: Authorization
                value: Bearer HOOK_KEY   # the same key as /etc/lbppc/accounts/hook.env
                in: header
    # Discord, once its application is registered (redirect URL:
    # https://lbppc.com/.ory/self-service/methods/oidc/callback/discord):
    # oidc:
    #   enabled: true
    #   config:
    #     providers:
    #       - id: discord
    #         provider: discord
    #         client_id: DISCORD_CLIENT_ID
    #         client_secret: DISCORD_CLIENT_SECRET
    #         scope: [identify]
    #         mapper_url: file:///etc/lbppc/accounts/kratos/discord-mapper.jsonnet

courier:
  smtp:
    connection_uri: smtps://SES_USER:SES_PASSWORD@email-smtp.REGION.amazonaws.com:465/
