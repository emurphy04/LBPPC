# /etc/systemd/system/lbppc-refresh.service.d/login-check.conf (then systemctl daemon-reload): Refresh's settings
# for asking shadNet whether a game login's account is signed in (lbppc-refresh-security.patch). The file holds
# shadNet's AdminApiKey: root-only (chmod 600), in a folder others can't list (chmod 711).
[Service]
EnvironmentFile=/etc/lbppc/refresh-login-check.env
