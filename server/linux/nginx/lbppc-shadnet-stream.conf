# shadNet over TLS through nginx (the stream module; include this file from nginx.conf's top level, outside http {}):
# players connect to 31313 with TLS, nginx passes the connection to shadNet on 31316 (closed in the firewall).
#
# proxy_protocol on: nginx first tells shadNet the player's address (a PROXY line, which shadNet believes only from
# 127.0.0.1). Without it every player looks like 127.0.0.1 to shadNet, and Refresh's login check (signed in to
# shadNet from the same address) refuses every game login. Restart shadNet and reload nginx together when turning it
# on: a shadNet without the LBPPC security patch drops connections that start with that line.
server {
    listen 31313 ssl;
    listen [::]:31313 ssl;
    ssl_certificate     /etc/letsencrypt/live/shadnet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadnet.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_protocol on;
    proxy_pass 127.0.0.1:31316;
    proxy_timeout 1h;
}
